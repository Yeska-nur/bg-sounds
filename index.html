<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Sounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100%; height: 100vh; overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #111;
  }

  /* Фоновый слой — показывает либо постер либо видео */
  .bg-layer {
    position: absolute; inset: 0;
    opacity: 0; transition: opacity 0.8s ease;
    z-index: 0;
  }
  .bg-layer.active { opacity: 1; }
  .bg-layer img, .bg-layer video {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
  }
  .bg-layer video { opacity: 0; transition: opacity 0.8s ease; }
  .bg-layer video.ready { opacity: 1; }

  .content {
    position: relative; z-index: 2; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 56px;
  }
  h1 { font-size: 48px; font-weight: 500; color: #fff; text-align: center; letter-spacing: -0.48px; line-height: 1.1; }
  .bottom-block { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .subtitle { font-size: 16px; color: #fff; text-align: center; }
  .card {
    background: rgba(255,255,255,0.10); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
    border-radius: 36px; padding: 16px; display: flex; flex-direction: column;
    gap: 24px; align-items: flex-start; width: fit-content;
  }
  .sound-btns { display: flex; gap: 10px; }
  .sound-btn {
    border-radius: 999px; border: none; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 18px;
    transition: background 0.2s ease;
  }
  .sound-btn:hover { background: rgba(255,255,255,0.1); }
  .sound-btn.active { background: rgba(255,255,255,0.06); }
  .try-btn {
    width: 100%; padding: 12px 16px; border-radius: 999px; border: none;
    background: #fff; color: #000; font-size: 16px; font-weight: 400; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: all 0.2s ease; line-height: 28px; white-space: nowrap;
  }
  .try-btn:hover { opacity: 0.92; }
  .try-btn.playing { background: rgba(255,255,255,0.15); color: #fff; }
</style>
</head>
<body>

<!-- Каждый слой = постер + видео поверх -->
<div class="bg-layer active" id="layer-thunder">
  <img src="./thunder.png" alt="">
  <video id="vid-thunder" src="./thunder.mp4" loop muted playsinline preload="auto"></video>
</div>
<div class="bg-layer" id="layer-train">
  <img src="./train.png" alt="">
  <video id="vid-train" src="./train.mp4" loop muted playsinline preload="auto"></video>
</div>
<div class="bg-layer" id="layer-cat">
  <img src="./cat.png" alt="">
  <video id="vid-cat" src="./cat.mp4" loop muted playsinline preload="auto"></video>
</div>
<div class="bg-layer" id="layer-none3">
  <img src="./wind.png" alt="">
</div>

<!-- Аудио -->
<audio id="aud-quran" src="./093.mp3"></audio>
<audio id="aud-thunder" src="./thunderStorm.mp3" loop preload="auto"></audio>
<audio id="aud-train" src="./train.mp3" loop preload="auto"></audio>

      <button class="try-btn" id="try-btn" onclick="togglePlay()">
        <svg id="play-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M18.1484 8.92969L6.89844 2.06251C6.71105 1.94375 6.49463 1.87876 6.27282 1.87463C6.05101 1.8705 5.83232 1.92738 5.64063 2.03907C5.44611 2.14579 5.28395 2.30297 5.17121 2.49407C5.05848 2.68518 4.99933 2.90313 5.00001 3.12501V16.875C4.99933 17.0969 5.05848 17.3148 5.17121 17.5059C5.28395 17.697 5.44611 17.8542 5.64063 17.9609C5.83232 18.0726 6.05101 18.1295 6.27282 18.1254C6.49463 18.1212 6.71105 18.0563 6.89844 17.9375L18.1484 11.0703C18.3328 10.9591 18.4854 10.8021 18.5912 10.6146C18.6971 10.427 18.7527 10.2154 18.7527 10C18.7527 9.78466 18.6971 9.57297 18.5912 9.38544C18.4854 9.19792 18.3328 9.04093 18.1484 8.92969Z" fill="black"/>
        </svg>
        <span id="btn-label">Try listening</span>
      </button>
    </div>
  </div>
</div>

<script>
  const SOUNDS = {
    thunder: { layer: 'layer-thunder', vid: 'vid-thunder', aud: 'aud-thunder' },
    train:   { layer: 'layer-train',   vid: 'vid-train',   aud: 'aud-train' },
    none3:   { layer: 'layer-none3',   vid: null,          aud: null },
    cat:     { layer: 'layer-cat',     vid: 'vid-cat',     aud: null },
  }

  const pauseSVG = `<path d="M16.875 3.75V16.25C16.875 16.5815 16.7433 16.8995 16.5089 17.1339C16.2745 17.3683 15.9565 17.5 15.625 17.5H12.8125C12.481 17.5 12.163 17.3683 11.9286 17.1339C11.6942 16.8995 11.5625 16.5815 11.5625 16.25V3.75C11.5625 3.41848 11.6942 3.10054 11.9286 2.86612C12.163 2.6317 12.481 2.5 12.8125 2.5H15.625C15.9565 2.5 16.2745 2.6317 16.5089 2.86612C16.7433 3.10054 16.875 3.41848 16.875 3.75ZM7.1875 2.5H4.375C4.04348 2.5 3.72554 2.6317 3.49112 2.86612C3.2567 3.10054 3.125 3.41848 3.125 3.75V16.25C3.125 16.5815 3.2567 16.8995 3.49112 17.1339C3.72554 17.3683 4.04348 17.5 4.375 17.5H7.1875C7.51902 17.5 7.83696 17.3683 8.07138 17.1339C8.3058 16.8995 8.4375 16.5815 8.4375 16.25V3.75C8.4375 3.41848 8.3058 3.10054 8.07138 2.86612C7.83696 2.6317 7.51902 2.5 7.1875 2.5Z" fill="white"/>`
  const playSVG = `<path d="M18.1484 8.92969L6.89844 2.06251C6.71105 1.94375 6.49463 1.87876 6.27282 1.87463C6.05101 1.8705 5.83232 1.92738 5.64063 2.03907C5.44611 2.14579 5.28395 2.30297 5.17121 2.49407C5.05848 2.68518 4.99933 2.90313 5.00001 3.12501V16.875C4.99933 17.0969 5.05848 17.3148 5.17121 17.5059C5.28395 17.697 5.44611 17.8542 5.64063 17.9609C5.83232 18.0726 6.05101 18.1295 6.27282 18.1254C6.49463 18.1212 6.71105 18.0563 6.89844 17.9375L18.1484 11.0703C18.3328 10.9591 18.4854 10.8021 18.5912 10.6146C18.6971 10.427 18.7527 10.2154 18.7527 10C18.7527 9.78466 18.6971 9.57297 18.5912 9.38544C18.4854 9.19792 18.3328 9.04093 18.1484 8.92969Z" fill="black"/>`

  let current = 'thunder'
  let isPlaying = false
  let bgAudio = null

  function getVid(id) {
    return SOUNDS[id].vid ? document.getElementById(SOUNDS[id].vid) : null
  }

  function playVideo(id) {
    const v = getVid(id)
    if (!v) return
    v.play().then(() => {
      v.classList.add('ready')
    }).catch(err => console.log('video play failed:', err))
  }

  function pauseVideo(id) {
    const v = getVid(id)
    if (v) { v.pause(); v.classList.remove('ready') }
  }

  function selectSound(id) {
    if (id === current) return

    // Скрываем старый слой
    document.getElementById(SOUNDS[current].layer).classList.remove('active')
    if (isPlaying) pauseVideo(current)

    // Показываем новый слой (сначала постер, потом видео)
    document.getElementById(SOUNDS[id].layer).classList.add('active')
    if (isPlaying) playVideo(id)

    // Кнопки
    document.querySelectorAll('.sound-btn').forEach(b => b.classList.remove('active'))
    document.querySelector(`[data-sound="${id}"]`).classList.add('active')

    current = id

    // Переключаем аудио
    if (isPlaying) {
      if (bgAudio) bgAudio.pause()
      const audId = SOUNDS[id].aud
      if (audId) {
        bgAudio = document.getElementById(audId)
        bgAudio.volume = 0.5
        bgAudio.play()
      } else { bgAudio = null }
    }
  }

  function togglePlay() {
    const btn = document.getElementById('try-btn')
    const icon = document.getElementById('play-icon')
    const quran = document.getElementById('aud-quran')

    if (!isPlaying) {
      isPlaying = true
      btn.classList.add('playing')
      icon.innerHTML = pauseSVG
      document.getElementById('btn-label').textContent = 'Stop listening'

      quran.volume = 0.8
      quran.play()

      playVideo(current)

      const audId = SOUNDS[current].aud
      if (audId) {
        bgAudio = document.getElementById(audId)
        bgAudio.volume = 0.5
        bgAudio.play()
      }
    } else {
      isPlaying = false
      btn.classList.remove('playing')
      icon.innerHTML = playSVG
      document.getElementById('btn-label').textContent = 'Try listening'

      quran.pause()
      pauseVideo(current)
      if (bgAudio) bgAudio.pause()
    }
  }
</script>
</body>
</html>

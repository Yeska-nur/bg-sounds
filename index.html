<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Sounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100%; height: 100vh; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; background: #111; }

  .bg-layer { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease; z-index: 0; }
  .bg-layer.active { opacity: 1; }
  .bg-layer img, .bg-layer video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .bg-layer video { opacity: 0; transition: opacity 0.8s ease; }
  .bg-layer video.ready { opacity: 1; }

  .content { position: relative; z-index: 2; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; }
  h1 { font-size: 48px; font-weight: 500; color: #fff; text-align: center; letter-spacing: -0.48px; line-height: 1.1; }

  @media (max-width: 480px) {
    h1 { font-size: 32px; letter-spacing: -0.32px; }
    .content { gap: 40px; padding: 16px; }
    .bottom-block { gap: 20px; }
    .card { padding: 14px; gap: 20px; border-radius: 28px; }
    .sound-btn { padding: 14px; }
    .sound-btn svg { width: 24px; height: 24px; }
    .try-btn { font-size: 15px; padding: 12px 14px; }
  }
  .bottom-block { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .subtitle { font-size: 16px; color: #fff; text-align: center; }
  .card { background: rgba(255,255,255,0.10); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border-radius: 36px; padding: 16px; display: flex; flex-direction: column; gap: 24px; align-items: flex-start; width: fit-content; }
  .sound-btns { display: flex; gap: 10px; }
  .sound-btn { border-radius: 999px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 18px; transition: background 0.2s ease; }
  .sound-btn:hover { background: rgba(255,255,255,0.1); }
  .sound-btn.active { background: rgba(255,255,255,0.06); }
  .try-btn { width: 100%; padding: 12px 16px; border-radius: 999px; border: none; background: #fff; color: #000; font-size: 16px; font-weight: 400; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s ease; line-height: 28px; white-space: nowrap; }
  .try-btn:hover { opacity: 0.92; }
  .try-btn.playing { background: rgba(255,255,255,0.15); color: #fff; }
</style>
</head>
<body>

<!-- Thunder -->
<div class="bg-layer active" id="layer-thunder">
  <img src="./thunder.png" alt="">
  <video id="vid-thunder" src="./thunder.mp4" loop muted playsinline preload="auto"></video>
</div>

<!-- Wind — видео со звуком внутри, не muted -->
<div class="bg-layer" id="layer-wind">
  <img src="./wind.png" alt="">
  <video id="vid-wind" src="./wind_new.mp4" loop playsinline preload="auto"></video>
</div>

<!-- Birds -->
<div class="bg-layer" id="layer-birds">
  <img src="./birds.png" alt="">
  <video id="vid-birds" src="./morning_birds.mp4" loop muted playsinline preload="auto"></video>
</div>

<!-- Whale -->
<div class="bg-layer" id="layer-whale">
  <img src="./whale.png" alt="">
  <video id="vid-whale" src="./whale_video.mp4" loop muted playsinline preload="auto"></video>
</div>

<!-- Сура -->
<audio id="aud-quran" src="./093.mp3"></audio>

<audio id="aud-whale" src="./whales.mp3" loop preload="auto"></audio>

    const v = document.getElementById(s.vid)
    if (!v) return
    // wind — со звуком, остальные muted
    v.muted = !s.hasVideoAudio
    v.play().then(() => v.classList.add('ready')).catch(e => console.log(e))
  }

  function pauseVideo(id) {
    const v = document.getElementById(SOUNDS[id].vid)
    if (v) { v.pause(); v.classList.remove('ready') }
  }

  function selectSound(id) {
    if (id === current) return

    document.getElementById(SOUNDS[current].layer).classList.remove('active')
    if (isPlaying) {
      pauseVideo(current)
      if (bgAudio) { bgAudio.pause(); bgAudio = null }
    }

    document.getElementById(SOUNDS[id].layer).classList.add('active')
    document.querySelectorAll('.sound-btn').forEach(b => b.classList.remove('active'))
    document.querySelector(`[data-sound="${id}"]`).classList.add('active')
    current = id

    if (isPlaying) {
      playVideo(id)
      const audId = SOUNDS[id].aud
      if (audId) {
        bgAudio = document.getElementById(audId)
        bgAudio.volume = 0.5
        bgAudio.play()
      }
    }
  }

  function togglePlay() {
    const btn = document.getElementById('try-btn')
    const icon = document.getElementById('play-icon')
    const quran = document.getElementById('aud-quran')

    if (!isPlaying) {
      isPlaying = true
      btn.classList.add('playing')
      icon.innerHTML = pauseSVG
      document.getElementById('btn-label').textContent = 'Stop listening'

      quran.volume = 0.8
      quran.play()
      playVideo(current)

      const audId = SOUNDS[current].aud
      if (audId) {
        bgAudio = document.getElementById(audId)
        bgAudio.volume = 0.5
        bgAudio.play()
      }
    } else {
      isPlaying = false
      btn.classList.remove('playing')
      icon.innerHTML = playSVG
      document.getElementById('btn-label').textContent = 'Try listening'

      quran.pause()
      pauseVideo(current)
      if (bgAudio) { bgAudio.pause(); bgAudio = null }
    }
  }
</script>
</body>
</html>
